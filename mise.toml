[tools]
bun = "latest"
go = "latest"
air = "latest"
duckdb = "latest"

# --- Setup & Maintenance ---

[tasks.setup]
description = "Install DuckDB spatial extension"
run = "duckdb -c 'INSTALL spatial;'"

[tasks.fmt-oxfmt]
run = "cd web && bun oxfmt ."
hide = true

[tasks.fmt-gofmt]
run = "gofmt -w ."
hide = true

[tasks.fmt-prettier]
run = "bun --cwd web prettier --write '../**/*.md'"
hide = true

[tasks.fmt]
description = "Format all source code (oxfmt + gofmt + prettier)"
depends = ["fmt-oxfmt", "fmt-gofmt", "fmt-prettier"]

[tasks.clean]
description = "Remove build artifacts"
run = ["rm -rf bin/map-tools tmp web/dist/*", "touch web/dist/.gitkeep"]

# --- Build ---

[tasks.web-build]
description = "Build the Vue frontend"
run = ["cd web && bun run build", "touch web/dist/.gitkeep"]

[tasks.build]
description = "Compile frontend then embed into Go binary"
depends = ["web-build"]
run = "go build -o bin/map-tools ."

# --- Run ---

[tasks.run]
description = "Build and run the compiled binary"
depends = ["build"]
run = "./bin/map-tools"


# --- Development ---

[tasks.dev]
description = "Run backend and frontend dev servers concurrently"
run = """
trap 'kill 0' SIGINT SIGTERM EXIT
air &
cd web && bun run dev
"""


[tasks.dev-backend]
description = "Start the Go server with live reload (requires air)"
run = "air"


[tasks.dev-frontend]
description = "Start the Vite dev server (proxies /api → :8080)"
run = "cd web && bun run dev"
